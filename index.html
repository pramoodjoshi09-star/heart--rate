<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dr. Heart - Pulse Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.22); }
      28% { transform: scale(1); }
      42% { transform: scale(1.12); }
      70% { transform: scale(1); }
    }
    .heart-pump {
      animation: heartbeat 1.1s infinite cubic-bezier(0.21, 0.61, 0.35, 1);
      display: inline-block;
      transform-origin: center;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4 selection:bg-rose-500">

  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col items-center">
    
    <!-- Red Heart Logo & Dr. Heart Title -->
    <div class="flex flex-col items-center gap-1.5 mb-4">
      <div class="relative flex items-center justify-center my-1">
        <span id="heartIcon" class="text-5xl heart-pump filter drop-shadow-[0_0_16px_rgba(239,68,68,0.7)]">❤️</span>
      </div>
      <h1 class="text-2xl font-black tracking-tight text-slate-100 flex items-center gap-1.5 mt-1">
        Dr. Heart
      </h1>
      <span class="text-[11px] text-slate-400 font-medium tracking-wide">Optical PPG Heart Rate Monitor</span>
    </div>

    <!-- Hidden Camera & Offscreen Processing Canvas -->
    <video id="webcam" playsinline autoplay class="hidden"></video>
    <canvas id="procCanvas" width="40" height="40" class="hidden"></canvas>

    <!-- Pulse Waveform Viewport -->
    <div class="w-full bg-slate-950 rounded-2xl border border-slate-800 p-2 mb-5 relative overflow-hidden">
      <canvas id="waveCanvas" width="300" height="90" class="w-full h-24 block"></canvas>
      <div id="statusBadge" class="absolute top-2 right-2 text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">
        Ready
      </div>
    </div>

    <!-- Live BPM Metric -->
    <div class="text-center my-3">
      <div class="flex items-baseline justify-center gap-1.5">
        <span id="bpmValue" class="text-6xl font-black tracking-tighter text-slate-100">--</span>
        <span class="text-sm font-semibold text-rose-500">BPM</span>
      </div>
      <p id="instructionText" class="text-xs text-slate-400 mt-2">Rest phone flat on a table, touch camera lightly</p>
    </div>

    <!-- Control Button -->
    <button id="toggleBtn" class="w-full mt-4 py-3.5 rounded-xl font-semibold bg-rose-600 hover:bg-rose-500 active:scale-95 transition-all shadow-lg shadow-rose-600/30">
      Start Measurement
    </button>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const procCanvas = document.getElementById('procCanvas');
    const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });
    const waveCanvas = document.getElementById('waveCanvas');
    const waveCtx = waveCanvas.getContext('2d');
    const bpmValue = document.getElementById('bpmValue');
    const instructionText = document.getElementById('instructionText');
    const statusBadge = document.getElementById('statusBadge');
    const toggleBtn = document.getElementById('toggleBtn');
    const heartIcon = document.getElementById('heartIcon');

    let stream = null;
    let track = null;
    let isRunning = false;
    let animFrame = null;

    let wavePoints = new Array(80).fill(45);
    let rawHistory = [];
    let rollingBPMs = [];
    let lastBeatTime = 0;
    let baseline = 0;

    toggleBtn.addEventListener('click', async () => {
      if (!isRunning) {
        await startMonitoring();
      } else {
        stopMonitoring();
      }
    });

    async function startMonitoring() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment',
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: 30 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        track = stream.getVideoTracks()[0];

        try {
          const caps = track.getCapabilities ? track.getCapabilities() : {};
          if (caps.torch) {
            await track.applyConstraints({ advanced: [{ torch: true }] });
          }
        } catch (e) {
          console.warn('Torch constraint unavailable:', e);
        }

        isRunning = true;
        toggleBtn.textContent = 'Stop Measurement';
        toggleBtn.classList.replace('bg-rose-600', 'bg-slate-700');
        instructionText.textContent = 'Place fingertip very gently over the lens';
        statusBadge.textContent = 'Calibrating...';
        statusBadge.className = 'absolute top-2 right-2 text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400';

        resetState();
        processFrame();
      } catch (err) {
        alert('Camera access failed: ' + err.message);
      }
    }

    function stopMonitoring() {
      isRunning = false;
      if (animFrame) cancelAnimationFrame(animFrame);
      if (track) track.stop();
      if (stream) stream.getTracks().forEach(t => t.stop());

      toggleBtn.textContent = 'Start Measurement';
      toggleBtn.classList.replace('bg-slate-700', 'bg-rose-600');
      statusBadge.textContent = 'Stopped';
      statusBadge.className = 'absolute top-2 right-2 text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-400';
      heartIcon.style.animationDuration = '1.1s';
    }

    function resetState() {
      rawHistory = [];
      rollingBPMs = [];
      lastBeatTime = 0;
      baseline = 0;
      bpmValue.textContent = '--';
    }

    function processFrame() {
      if (!isRunning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        procCtx.drawImage(video, 0, 0, 40, 40);
        const imgData = procCtx.getImageData(0, 0, 40, 40).data;

        let rTotal = 0, gTotal = 0, bTotal = 0;
        const totalPixels = 40 * 40;

        for (let i = 0; i < imgData.length; i += 4) {
          rTotal += imgData[i];
          gTotal += imgData[i + 1];
          bTotal += imgData[i + 2];
        }

        const avgR = rTotal / totalPixels;
        const avgG = gTotal / totalPixels;
        const avgB = bTotal / totalPixels;

        // Fingertip detection
        const isFingerCovered = avgR > 60 && avgR > (avgG + avgB) * 1.15;

        if (!isFingerCovered) {
          statusBadge.textContent = 'No Finger';
          statusBadge.className = 'absolute top-2 right-2 text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-400';
          instructionText.textContent = 'Cover the camera and flash gently';
          drawWaveform(45);
        } else {
          statusBadge.textContent = 'Tracking';
          statusBadge.className = 'absolute top-2 right-2 text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400';
          instructionText.textContent = 'Hold still... reading pulse';

          analyzeSignal(avgG);
        }
      }

      animFrame = requestAnimationFrame(processFrame);
    }

    function analyzeSignal(rawVal) {
      const now = performance.now();

      if (baseline === 0) baseline = rawVal;
      baseline = 0.94 * baseline + 0.06 * rawVal;
      const filtered = rawVal - baseline;

      rawHistory.push({ time: now, val: filtered });
      if (rawHistory.length > 90) rawHistory.shift();

      const normalizedY = 45 - (filtered * 25);
      drawWaveform(Math.max(10, Math.min(80, normalizedY)));

      if (rawHistory.length < 30) return;

      const idx = rawHistory.length - 2;
      const prev = rawHistory[idx - 1].val;
      const curr = rawHistory[idx].val;
      const next = rawHistory[idx + 1].val;

      // Systolic peak identification with physiological refractory lockout
      if (curr > prev && curr > next && curr > 0.45) {
        const beatInterval = now - lastBeatTime;

        if (beatInterval > 430 && beatInterval < 1400) {
          const instantBPM = 60000 / beatInterval;

          rollingBPMs.push(instantBPM);
          if (rollingBPMs.length > 7) rollingBPMs.shift();

          const sorted = [...rollingBPMs].sort((a, b) => a - b);
          const medianBPM = Math.round(sorted[Math.floor(sorted.length / 2)]);

          bpmValue.textContent = medianBPM;

          // Sync heart pump rate with detected pulse
          const cycleSeconds = (60 / medianBPM).toFixed(2);
          heartIcon.style.animationDuration = `${cycleSeconds}s`;

          lastBeatTime = now;
        } else if (beatInterval >= 1400) {
          lastBeatTime = now;
        }
      }
    }

    function drawWaveform(newY) {
      wavePoints.push(newY);
      wavePoints.shift();

      waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
      waveCtx.beginPath();
      waveCtx.strokeStyle = '#f43f5e';
      waveCtx.lineWidth = 2.5;
      waveCtx.lineJoin = 'round';

      const step = waveCanvas.width / (wavePoints.length - 1);
      for (let i = 0; i < wavePoints.length; i++) {
        const x = i * step;
        const y = wavePoints[i];
        if (i === 0) waveCtx.moveTo(x, y);
        else waveCtx.lineTo(x, y);
      }
      waveCtx.stroke();
    }
  </script>
</body>
</html>
